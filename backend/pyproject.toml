[project]
name = "supportpilot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "llama-index-core",
    "llama-index-embeddings-ollama",
    "llama-index-llms-ollama>=0.11.0",
    "llama-index-vector-stores-postgres",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
